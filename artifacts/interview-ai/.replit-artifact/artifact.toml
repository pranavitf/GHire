kind = "web"
previewPath = "/"
title = "InterView.ai"
version = "1.0.0"
id = "artifacts/interview-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23149
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/interview-ai run dev"

[services.env]
PORT = "23149"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/interview-ai", "run", "build"]
publicDir = "artifacts/interview-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
