steps:
  # ── Build API Server image ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ai-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ai-api:latest'
      - '.'

  # ── Build Web Frontend image ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.web'
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=${_GEMINI_API_KEY}'
      - '--build-arg'
      - 'VITE_API_BASE_URL=https://${_API_SERVICE_URL}/api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ai-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ai-web:latest'
      - '.'

  # ── Push images ───────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args: ['push', 'gcr.io/$PROJECT_ID/interview-ai-api:$COMMIT_SHA']
    waitFor: ['build-api']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    args: ['push', 'gcr.io/$PROJECT_ID/interview-ai-web:$COMMIT_SHA']
    waitFor: ['build-web']

  # ── Deploy API to Cloud Run ───────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'interview-ai-api'
      - '--image=gcr.io/$PROJECT_ID/interview-ai-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--set-env-vars=NODE_ENV=production,DATABASE_URL=${_DATABASE_URL},SESSION_SECRET=${_SESSION_SECRET},Gemini_API_Key=${_GEMINI_API_KEY},AI_INTEGRATIONS_GEMINI_BASE_URL=${_GEMINI_BASE_URL},AI_INTEGRATIONS_GEMINI_API_KEY=${_GEMINI_API_KEY}'
    waitFor: ['push-api']

  # ── Deploy Web to Cloud Run ───────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'interview-ai-web'
      - '--image=gcr.io/$PROJECT_ID/interview-ai-web:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
    waitFor: ['push-web']

images:
  - 'gcr.io/$PROJECT_ID/interview-ai-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/interview-ai-api:latest'
  - 'gcr.io/$PROJECT_ID/interview-ai-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/interview-ai-web:latest'

substitutions:
  _GEMINI_API_KEY: ''
  _DATABASE_URL: ''
  _SESSION_SECRET: ''
  _API_SERVICE_URL: ''
  _GEMINI_BASE_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
